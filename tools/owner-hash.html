<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWNER parol hash generatori</title>
<style>body{font-family:Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#17243b}input,button,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #d0d8e6;border-radius:8px}button{background:#245cff;color:#fff;border:0;cursor:pointer;font-weight:700}textarea{height:110px;font-family:monospace;font-size:12px}small{color:#667}</style></head>
<body>
<h2>OWNER parol hash generatori</h2>
<p><small>Bu sahifa faqat o‘zingizning kompyuteringizda ishlaydi (internetga hech narsa yuborilmaydi). Netlify’ga yuklamang — saytning o‘zida kerak emas.</small></p>
<label>Yangi OWNER paroli (uzun va noyob bo‘lsin, kamida 12 belgi tavsiya etiladi)</label>
<input id="pw" type="password" autocomplete="new-password">
<button id="go" type="button">Hash yaratish</button>
<label>Natija — <code>script.js</code> boshidagi <code>OWNER_CREDS</code> ro‘yxatiga qo‘ying</label>
<textarea id="out" readonly></textarea>
<script>
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
document.getElementById('go').addEventListener('click',async()=>{
  const pw=document.getElementById('pw').value;if(pw.length<8){document.getElementById('out').value='Parol kamida 8 ta belgi bo‘lsin.';return}
  const salt=hex(crypto.getRandomValues(new Uint8Array(16))),enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:310000},key,256);
  document.getElementById('out').value=`{salt:'${salt}',hash:'${hex(bits)}',iter:310000},`;
});
</script></body></html>
